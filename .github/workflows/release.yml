name: Release

# Push a tag like v1.2.0 to build the Windows and Mac apps and attach them to a
# GitHub Release:  git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            zip: Studeck-Windows.zip
          - os: macos-latest
            zip: Studeck-Mac.zip
    runs-on: ${{ matrix.os }}
    env:
      STUDECK_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller studeck.spec --noconfirm
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Studeck -DestinationPath ${{ matrix.zip }}
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        # ditto keeps the app bundle's symlinks and signature intact (zip doesn't).
        run: ditto -c -k --sequesterRsrc --keepParent dist/Studeck.app ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Studeck-Windows.zip
            Studeck-Mac.zip
          generate_release_notes: true
