name: Release

# Push a tag like v1.2.0 to build the Windows and Mac apps and attach them to a
# GitHub Release:  git tag v1.2.0 && git push origin v1.2.0
# Pushing any other branch than main builds them too, without a release, to try
# out first: download them from that run's page in the Actions tab (Artifacts).
# Either way the downloads are the same files: Studeck-Mac.dmg and
# Studeck-Windows.zip (uploaded as they are, not zipped again by GitHub).
# To build them again for a release that already exists (e.g. one missing a
# file): Actions tab -> Release -> Run workflow, and type its tag.
on:
  push:
    tags: ["v*"]
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the apps to this existing release (e.g. v0.1.1). Leave empty for a test build."
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: Studeck-Windows.zip
          - os: macos-latest
            file: Studeck-Mac.dmg
    runs-on: ${{ matrix.os }}
    env:
      STUDECK_VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m PyInstaller studeck.spec --noconfirm
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Studeck -DestinationPath ${{ matrix.file }}
      - name: Disk image (Mac)
        if: runner.os == 'macOS'
        # The usual Mac installer: open it and drag Studeck into Applications.
        # (ditto keeps the app bundle's symlinks and signature intact.)
        run: |
          mkdir dmg
          ditto dist/Studeck.app dmg/Studeck.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname Studeck -srcfolder dmg -fs HFS+ -format UDZO -ov ${{ matrix.file }}
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.file }}
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # skip-decompress: keep Studeck-Windows.zip a zip (it would be unpacked).
      - uses: actions/download-artifact@v8
        with:
          name: Studeck-Windows.zip
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: Studeck-Mac.dmg
          skip-decompress: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            Studeck-Windows.zip
            Studeck-Mac.dmg
          fail_on_unmatched_files: true
          generate_release_notes: ${{ !inputs.tag }}
