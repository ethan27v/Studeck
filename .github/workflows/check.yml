name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Python compiles
        run: python -m compileall -q -x "(\.git|tests)" .
      - name: Modules import (including this platform's desktop backend)
        run: python -c "import sys, importlib; [importlib.import_module(m) for m in ('calendars', 'media', 'reminders', 'desktop_mac' if sys.platform == 'darwin' else 'desktop_win')]"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check importer.js
          node --check settings.js
          node --check data.js
